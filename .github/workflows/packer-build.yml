name: Packer Build & Deploy

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  # --------------------------------------------------
  # Job 1: Run integration tests
  # --------------------------------------------------
  test:
    name: Run Integration Tests
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/${{ secrets.DB_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Prisma migrations
        run: npm run prisma:migrate:deploy

      - name: Run tests
        run: npm test -- --passWithNoTests

  # --------------------------------------------------
  # Job 2: Build AMI in DEV account
  # --------------------------------------------------
  build-image:
    name: Build Custom Images
    runs-on: ubuntu-latest
    needs: test
    outputs:
      ami_id: ${{ steps.get-ami.outputs.ami_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Build the application artifact
      - name: Install dependencies
        run: npm install --omit=dev

      - name: Build application artifact
        run: |
          zip -r webapp.zip . \
            -x "node_modules/*" \
            -x ".git/*" \
            -x ".env" \
            -x "webapp.zip" \
            -x "packer/*" \
            -x "*.md" \
            -x "tests/*" \
            -x ".github/*" \
            -x ".gitignore"

      # Setup Packer
      - name: Setup Packer
        uses: hashicorp/setup-packer@main

      - name: Packer Init
        run: packer init packer/

      # Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Configure GCP credentials
      # - name: Authenticate to Google Cloud
      #   uses: google-github-actions/auth@v2
      #   with:
      #     credentials_json: ${{ secrets.GCP_SA_KEY }}

      # - name: Setup Google Cloud SDK
      #   uses: google-github-actions/setup-gcloud@v2

      - name: Build AWS AMI
        run: |
          packer build -only="amazon-ebs.webapp" \
            -var "aws_region=${{ secrets.AWS_REGION }}" \
            -var "aws_demo_account_id=${{ secrets.AWS_DEMO_ACCOUNT_ID }}" \
            packer/

      # - name: Build GCP Image
      #   run: |
      #     packer build -only="googlecompute.webapp" \
      #       -var "gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" \
      #       -var "gcp_demo_project_id=${{ secrets.GCP_DEMO_PROJECT_ID }}" \
      #       -var "db_password=${{ secrets.DB_PASSWORD }}" \
      #       packer/

      # Share GCP image with DEMO project
      # - name: Share GCP Image with DEMO Project
      #   run: |
      #     IMAGE_NAME=$(gcloud compute images list \
      #       --project=${{ secrets.GCP_PROJECT_ID }} \
      #       --filter="family=csye6225-webapp" \
      #       --sort-by="~creationTimestamp" \
      #       --limit=1 \
      #       --format="value(name)")

      #     gcloud compute images add-iam-policy-binding "$IMAGE_NAME" \
      #       --project=${{ secrets.GCP_PROJECT_ID }} \
      #       --member="serviceAccount:${{ secrets.GCP_DEMO_SERVICE_ACCOUNT }}" \
      #       --role="roles/compute.imageUser"

      - name: Get AMI ID
        id: get-ami
        run: |
          AMI_ID=$(jq -r '.builds[-1].artifact_id' packer-manifest.json | cut -d':' -f2)
          echo "ami_id=$AMI_ID" >> "$GITHUB_OUTPUT"
          echo "Built AMI: $AMI_ID"

  # --------------------------------------------------
  # Job 3: Deploy to DEMO account
  # --------------------------------------------------
  deploy-demo:
    name: Deploy to DEMO
    runs-on: ubuntu-latest
    needs: build-image

    steps:
      - name: Configure DEMO AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEMO_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEMO_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create new Launch Template version
        run: |
          aws ec2 create-launch-template-version \
            --launch-template-name csye6225_asg \
            --source-version '$Latest' \
            --launch-template-data '{"ImageId":"${{ needs.build-image.outputs.ami_id }}"}'

      - name: Start instance refresh
        id: refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name csye6225-demo-asg \
            --output text \
            --query 'InstanceRefreshId')
          echo "refresh_id=$REFRESH_ID" >> "$GITHUB_OUTPUT"
          echo "Instance refresh started: $REFRESH_ID"

      - name: Wait for instance refresh to complete
        run: |
          echo "Waiting for instance refresh to complete..."
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name csye6225-demo-asg \
              --instance-refresh-ids ${{ steps.refresh.outputs.refresh_id }} \
              --query 'InstanceRefreshes[0].Status' \
              --output text)
            echo "Current status: $STATUS"

            if [ "$STATUS" = "Successful" ]; then
              echo "Instance refresh completed successfully!"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Instance refresh failed with status: $STATUS"
              exit 1
            fi

            sleep 30
          done