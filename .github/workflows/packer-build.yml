name: Packer Build

on:
  push:
    branches:
      - main

jobs:
  # --------------------------------------------------
  # Job 1: Run integration tests
  # --------------------------------------------------
  test:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    # env:
    #   DATABASE_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/${{ secrets.DB_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Prisma migrations
        run: npm run prisma:migrate:deploy

      - name: Run tests
        run: npm test -- --passWithNoTests

  # --------------------------------------------------
  # Job 2: Build application artifact and custom images
  # Image build only runs if tests pass
  # --------------------------------------------------
  build-image:
    name: Build Custom Images
    runs-on: ubuntu-latest
    needs: test
    # env:
    #   DATABASE_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/${{ secrets.DB_NAME }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Build the application artifact
      - name: Install dependencies
        run: npm install --omit=dev

      - name: Build application artifact
        run: |
          zip -r webapp.zip . \
            -x "node_modules/*" \
            -x ".git/*" \
            -x ".env" \
            -x "webapp.zip" \
            -x "packer/*" \
            -x "*.md" \
            -x "tests/*" \
            -x ".github/*" \
            -x ".gitignore"

      # Setup Packer
      - name: Setup Packer
        uses: hashicorp/setup-packer@main

      - name: Packer Init
        run: packer init packer/

      # Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Configure GCP credentials
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build AWS AMI
        run: |
          packer build -only="amazon-ebs.webapp" \
            -var "aws_region=${{ secrets.AWS_REGION }}" \
            -var "aws_demo_account_id=${{ secrets.AWS_DEMO_ACCOUNT_ID }}" \
            packer/

      # - name: Build GCP Image
      #   run: |
